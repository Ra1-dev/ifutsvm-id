[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ifutsvm"
version = "0.1.0"
description = "Auditable faithful and corrected IFUTSVM-ID implementations"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.6", "clarabel>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "cvxpy>=1.5", "imbalanced-learn>=0.12", "pyarrow>=14"]
experiments = ["imbalanced-learn>=0.12", "pyarrow>=14"]
artifacts = ["matplotlib>=3.8", "pillow>=10", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6", "pypdfium2>=5", "bibtexparser>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
